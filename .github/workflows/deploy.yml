name: Deploy

on:
  push:
    branches: [main]

# One deploy at a time; a newer push replaces a waiting one.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: eos-site
      - uses: actions/checkout@v4
        with:
          repository: Dame-G/eos
          path: eos
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable

      - name: Install and build the library
        working-directory: eos
        run: |
          pnpm install --frozen-lockfile
          pnpm -r --workspace-concurrency=1 build

      - name: Install the site
        working-directory: eos-site
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Build the docs
        working-directory: eos-site
        run: pnpm docs:build

      - name: Test
        working-directory: eos-site
        run: pnpm test
        env:
          CI: "true"

      - name: Deploy to Cloudflare
        working-directory: eos-site
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
