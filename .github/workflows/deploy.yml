name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # The build and tests always run; the deploy step runs only once both Cloudflare secrets exist.
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: eos-site
      - uses: actions/checkout@v7
        with:
          repository: Dame-G/eos
          ref: ${{ vars.EOS_REF || 'main' }}
          path: eos
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            eos-site/pnpm-lock.yaml
            eos/pnpm-lock.yaml

      - name: Install and build the library
        working-directory: eos
        run: |
          pnpm install --frozen-lockfile
          pnpm -r --workspace-concurrency=1 build

      - name: Install the site
        working-directory: eos-site
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Build the docs
        working-directory: eos-site
        run: pnpm docs:build

      - name: Test
        working-directory: eos-site
        run: pnpm test
        env:
          CI: "true"

      - name: Warn when Cloudflare secrets are missing
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set, so nothing was deployed."

      - name: Deploy to Cloudflare
        if: env.HAS_CLOUDFLARE == 'true'
        working-directory: eos-site
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
