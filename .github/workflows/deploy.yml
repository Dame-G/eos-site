name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      eos_ref:
        description: "Library ref to build against: a branch, a tag such as @eos-ui/vue@0.7.0, or a commit. Empty uses the EOS_REF variable, then the latest released @eos-ui/vue tag."
        required: false
        default: ""

# One deploy at a time.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Every gate always runs; the deploy step runs only once both Cloudflare secrets exist.
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: eos-site
      # The build and a sample of pages; the pull request ran every gate. Production shows the latest released library unless a ref is given by hand or in EOS_REF, so it never documents unreleased code.
      - uses: ./eos-site/.github/actions/verify
        with:
          eos-ref: ${{ inputs.eos_ref || vars.EOS_REF || 'latest-release' }}
          full: false

      - name: Warn when Cloudflare secrets are missing
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set, so nothing was deployed."

      - name: Deploy to Cloudflare
        if: env.HAS_CLOUDFLARE == 'true'
        working-directory: eos-site
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
