name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: eos-site
      # Pull requests build against the library's main branch, so changes that need unreleased library code are caught early.
      - uses: ./eos-site/.github/actions/verify
        with:
          eos-ref: ${{ vars.EOS_REF || 'main' }}
