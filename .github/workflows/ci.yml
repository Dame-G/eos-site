name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # The site documents the public library, so both are checked out side by side.
      - uses: actions/checkout@v4
        with:
          path: eos-site
      - uses: actions/checkout@v4
        with:
          repository: Dame-G/eos
          path: eos
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable

      - name: Install and build the library
        working-directory: eos
        run: |
          pnpm install --frozen-lockfile
          pnpm -r --workspace-concurrency=1 build

      - name: Install the site
        working-directory: eos-site
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Build the docs
        working-directory: eos-site
        run: pnpm docs:build

      - name: Test
        working-directory: eos-site
        run: pnpm test
        env:
          CI: "true"

      - name: Check whole pages (axe, links) and the layout at phone and desktop widths
        working-directory: eos-site
        run: |
          pnpm exec vitepress preview docs --port 4173 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173 > /dev/null && break; sleep 1; done
          pnpm pages:check
          pnpm layout:check
        env:
          CI: "true"
