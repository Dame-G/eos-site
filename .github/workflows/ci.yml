name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: eos-site
      # Pull requests build against the library branch of the same name when there is one, so a change made in both
      # repositories together is checked as a pair; otherwise against the EOS_REF variable, else the library's main, so
      # changes that need unreleased library code are caught early.
      - name: Pick the library ref
        id: eos
        env:
          HEAD_REF: ${{ github.head_ref }}
          FALLBACK: ${{ vars.EOS_REF || 'main' }}
        run: |
          if [ -n "$HEAD_REF" ] && git ls-remote --exit-code --heads https://github.com/Dame-G/eos.git "refs/heads/$HEAD_REF" > /dev/null; then
            echo "ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$FALLBACK" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./eos-site/.github/actions/verify
        with:
          eos-ref: ${{ steps.eos.outputs.ref }}
