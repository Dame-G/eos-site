name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # The site documents the public library, so both are checked out side by side.
      - uses: actions/checkout@v4
        with:
          path: eos-site
      - uses: actions/checkout@v4
        with:
          repository: Dame-G/eos
          ref: ${{ vars.EOS_REF || 'main' }}
          path: eos
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            eos-site/pnpm-lock.yaml
            eos/pnpm-lock.yaml

      - name: Install and build the library
        working-directory: eos
        run: |
          pnpm install --frozen-lockfile
          pnpm -r --workspace-concurrency=1 build

      - name: Install the site
        working-directory: eos-site
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Build the docs
        working-directory: eos-site
        run: pnpm docs:build

      - name: Test
        working-directory: eos-site
        run: pnpm test
        env:
          CI: "true"

      - name: Check pages and server rendering
        working-directory: eos-site
        run: |
          pnpm docs:preview --host 127.0.0.1 --port 4173 &
          preview=$!
          trap 'kill $preview' EXIT
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          pnpm pages:check http://127.0.0.1:4173
          pnpm ssr:check
        env:
          CI: "true"
