name: Build and verify the docs
description: Checks out and builds the library, then builds the site and checks it. Used by CI (every gate, every page) and Deploy (the build and a sample of pages, since the pull request already ran the rest). The site must already be checked out at ./eos-site.

inputs:
  eos-ref:
    description: "Library ref to build against: a branch, a tag or a commit. The word latest-release means the highest released @eos-ui/vue@x.y.z tag."
    required: true
  full:
    description: "true runs knip, the tests and the page checks on every page. false builds and checks a sample of pages."
    default: "true"

runs:
  using: composite
  steps:
    - name: Resolve the library ref
      id: ref
      shell: bash
      env:
        REQUESTED: ${{ inputs.eos-ref }}
      run: |
        if [ "$REQUESTED" != "latest-release" ]; then
          echo "ref=$REQUESTED" >> "$GITHUB_OUTPUT"
          echo "Building against the requested library ref: $REQUESTED"
          exit 0
        fi
        tag=$(git ls-remote --tags --refs https://github.com/Dame-G/eos.git '@eos-ui/vue@*' \
          | sed 's|.*refs/tags/||' \
          | grep -E '^@eos-ui/vue@[0-9]+\.[0-9]+\.[0-9]+$' \
          | sort -t@ -k3 -V \
          | tail -n 1)
        if [ -z "$tag" ]; then
          echo "::error::Could not find a released @eos-ui/vue@x.y.z tag in Dame-G/eos. Not falling back to main. Run the workflow by hand with eos_ref, or set the EOS_REF variable."
          exit 1
        fi
        echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"
        echo "Building against the latest released library: $tag"

    # The site documents the public library, so both are checked out side by side. Full history, because each component
    # page shows when its folder last changed (git log); file contents are fetched only for the checked-out commit.
    - uses: actions/checkout@v7
      with:
        repository: Dame-G/eos
        ref: ${{ steps.ref.outputs.ref }}
        path: eos
        fetch-depth: 0
        filter: blob:none
        persist-credentials: false

    - uses: pnpm/action-setup@v6
      with:
        package_json_file: eos-site/package.json

    # Node 22 is the lowest version both repositories allow (engines >=22).
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: |
          eos-site/pnpm-lock.yaml
          eos/pnpm-lock.yaml

    - name: Install and build the library
      shell: bash
      working-directory: eos
      run: |
        pnpm install --frozen-lockfile
        pnpm build

    - name: Install the site
      shell: bash
      working-directory: eos-site
      run: |
        pnpm install --frozen-lockfile
        pnpm exec playwright install --with-deps chromium

    - name: Find unused files, exports and dependencies
      if: inputs.full == 'true'
      shell: bash
      working-directory: eos-site
      run: pnpm knip

    - name: Type-check
      if: inputs.full == 'true'
      shell: bash
      working-directory: eos-site
      run: pnpm typecheck

    - name: Build the docs
      shell: bash
      working-directory: eos-site
      run: pnpm docs:build

    - name: Check the built pages
      shell: bash
      working-directory: eos-site
      run: pnpm build:check

    - name: Test
      if: inputs.full == 'true'
      shell: bash
      working-directory: eos-site
      run: pnpm test
      env:
        CI: "true"

    # Every page with --all; otherwise the static pages and a few components.
    - name: Check pages (light and dark)
      shell: bash
      working-directory: eos-site
      run: |
        pnpm docs:preview --host 127.0.0.1 --port 4173 &
        preview=$!
        trap 'kill $preview' EXIT
        for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
        pnpm pages:check http://127.0.0.1:4173 ${{ inputs.full == 'true' && '--all' || '' }}
      env:
        CI: "true"
