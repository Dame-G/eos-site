<style>body{margin:0;padding:16px;background:var(--surface)}</style>
<div id="root" class="op-root"></div>
<script>
  var P = window.OpenPractice, h = React.createElement;
  ReactDOM.createRoot(document.getElementById("root")).render(h("div",{style:{display:"grid",gap:12,justifyItems:"start"}},
    h(P.Toast,{tone:"success",title:"Payment received",onClose:function(){}},"A receipt was sent to maria@example.com."),
    h(P.Toast,{tone:"danger",title:"Couldn't save your changes",onClose:function(){},action:[h(P.Button,{key:"a",variant:"outline"},"Try again")]},"Check your connection, then try again."),
    h("div",{style:{width:320,maxWidth:"100%"}},h(P.Toast,{tone:"warning",title:"Session ending soon",action:h(P.Button,{variant:"outline"},"Stay signed in")},"You will be signed out in 2 minutes."))));
</script>
