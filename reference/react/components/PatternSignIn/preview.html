<!-- @dsCard group="Patterns" height=720 subtitle="Sign in with a password or a code" -->
<style>body{margin:0;padding:16px;background:var(--surface)}</style>
<div id="root" class="op-root"></div>
<script>
  var P = window.OpenPractice, h = React.createElement;

  function Demo() {
    var s = React.useState(""), code = s[0], setCode = s[1];
    return h(P.Grid,{min:"20rem",gap:6,style:{maxWidth:880}},
      h(P.Surface,{pad:"lg",actions:[h(P.Button,{key:"s"},"Sign in"),h(P.Button,{key:"c",variant:"outline",icon:"mail"},"Email me a sign-in code")]},h(P.Stack,{gap:4},
        h(P.Heading,{level:2},"Sign in"),
        h(P.Field,{label:"Email address",type:"email",autoComplete:"username",required:true,placeholder:"name@example.com"}),
        h(P.PasswordField,{label:"Password",required:true}),
        h(P.Link,{href:"#"},"Forgot your password?"),
        h(P.Checkbox,{label:"Keep me signed in on this device"}))),
      h(P.Surface,{pad:"lg",actions:[h(P.Button,{key:"v",disabled:code.length<6},"Verify and sign in"),h(P.Button,{key:"n",variant:"quiet"},"Send a new code")]},h(P.Stack,{gap:4},
        h(P.BackLink,{href:"#"},"Back to sign in"),
        h(P.Heading,{level:2},"Check your email"),
        h(P.Text,{muted:true},"We sent a 6-digit code to m***@example.com. It expires in 10 minutes."),
        h(P.OtpField,{label:"Sign-in code",value:code,onChange:setCode,groupSize:3,hint:"Enter the code from the email."}))));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(Demo));
</script>
