<!-- @dsCard group="Foundations" height=960 subtitle="Every state a form control can be in" -->
<style>body{margin:0;padding:16px;background:var(--surface)}</style>
<div id="root" class="op-root"></div>
<script>
  var P = window.OpenPractice, h = React.createElement;

  function Row(label, node) { return h("div",{key:label,style:{display:"grid",gap:6}},h(P.Kicker,null,label),node); }
  function Demo() {
    var cols = [
      ["Default", {}],
      ["Filled", {defaultValue:"Maria Okafor"}],
      ["Hint", {hint:"As it appears on your ID."}],
      ["Error", {defaultValue:"Maria", error:"Enter your first and last name."}],
      ["Read-only", {defaultValue:"Maria Okafor",readOnly:true}],
      ["Disabled", {defaultValue:"Maria Okafor",disabled:true}]
    ];
    return h("div",{style:{display:"grid",gap:28,maxWidth:880}},
      h(P.Grid,{min:"16rem",gap:6},cols.map(function(c){return Row(c[0],h(P.Field,Object.assign({label:"Full name"},c[1])));})),
      h(P.Grid,{min:"16rem",gap:6},
        Row("Select",h(P.Select,{label:"Pay with",options:["Visa ending 4242","Bank account"],defaultValue:"Visa ending 4242"})),
        Row("Select, error",h(P.Select,{label:"Pay with",options:["Visa ending 4242"],error:"Choose how you will pay."})),
        Row("Select, disabled",h(P.Select,{label:"Pay with",options:["Visa ending 4242"],defaultValue:"Visa ending 4242",disabled:true}))),
      h(P.Grid,{min:"16rem",gap:6},
        Row("Checkbox",h(P.Stack,{gap:2},h(P.Checkbox,{label:"Unchecked"}),h(P.Checkbox,{label:"Checked",defaultChecked:true}),h(P.Checkbox,{label:"Disabled",disabled:true}))),
        Row("Checkbox, error",h(P.Checkbox,{label:"I agree to the payment policy",error:"You must agree to continue."})),
        Row("Switch",h(P.Stack,{gap:2},h(P.Switch,{label:"Off"}),h(P.Switch,{label:"On",defaultChecked:true}),h(P.Switch,{label:"Disabled",disabled:true})))),
      h(P.Grid,{min:"16rem",gap:6},
        Row("Radio group",h(P.RadioGroup,{label:"Reminder",options:["Text","Email"],defaultValue:"Text"})),
        Row("Radio group, error",h(P.RadioGroup,{label:"Reminder",options:["Text","Email"],error:"Choose one."})),
        Row("Number",h(P.NumberField,{label:"Visits",defaultValue:2,min:0,max:10}))));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(Demo));
</script>
