<!-- @dsCard group="Feedback" height=240 subtitle="Toasts from anywhere in the app" -->
<style>body{margin:0;padding:16px;background:var(--surface)}</style>
<div id="root" class="op-root"></div>
<script>
  var P = window.OpenPractice, h = React.createElement;
  function ToastDemo() {
    var toast = P.useToast();
    return h(P.Inline,{gap:2},
      h(P.Button,{onClick:function(){toast.show({tone:"success",title:"Payment received",children:"A receipt was sent to your email."});}},"Pay $162.40"),
      h(P.Button,{variant:"outline",onClick:function(){toast.show({tone:"danger",title:"We could not process your payment",action:h(P.Button,{variant:"outline",onClick:toast.clear},"Try another card")});}},"Simulate an error"));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(P.ToastProvider,null,h(ToastDemo)));
</script>
