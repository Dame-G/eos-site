<!-- @dsCard group="Patterns" height=760 subtitle="Pay a balance in full or in part" -->
<style>body{margin:0;padding:16px;background:var(--surface)}</style>
<div id="root" class="op-root"></div>
<script>
  var P = window.OpenPractice, h = React.createElement;
  function Demo() {
    var s1 = React.useState("full"), mode = s1[0], setMode = s1[1];
    var s2 = React.useState("card"), method = s2[0], setMethod = s2[1];
    var amount = mode === "full" ? 162.4 : 100;
    return h("div",{style:{maxWidth:560}},h(P.Surface,{pad:"md",actions:[h(P.Button,{key:"p",icon:"lock"},"Pay $"+amount.toFixed(2)),h(P.Button,{key:"c",variant:"outline"},"Cancel")]},h(P.Stack,{gap:6},
      h(P.Stack,{gap:3},
        h(P.BackLink,{href:"#"},"Back to statements"),
        h(P.Stack,{gap:3},h(P.Heading,{level:2,kicker:"Statement 4471"},"Pay your balance"),h(P.AmountFigure,{label:"You owe",amount:162.4,details:[{label:"Due",value:"Nov 1"}]}))),
      h(P.Stack,{gap:4},
        h(P.RadioGroup,{label:"How much would you like to pay?",value:mode,onChange:setMode,options:[{value:"full",label:"The full balance",description:"$162.40"},{value:"part",label:"Another amount",reveal:h(P.CurrencyField,{label:"Amount",hideLabel:true,defaultValue:100,max:162.4,hint:"Up to $162.40."})}]}),
        h(P.Stack,{gap:2},
          h(P.Select,{label:"Pay with",value:method,onChange:setMethod,options:[{value:"card",label:"Visa ending 4242",icon:"card"},{value:"bank",label:"Bank account ending 6789",icon:"wallet"},{value:"new",label:"A new card",icon:"plus"}]}),
          method === "new" ? h(P.PaymentCardField,{label:"Card details"},h("span",{style:{color:"var(--muted)",font:"400 16px var(--font-mono)"}},"1234 5678 9012 3456")) : null)),
      h(P.Notice,{tone:"warning",title:"Pay by November 1 to avoid a late fee"},"A $15.00 fee is added to balances paid after the due date."))));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(Demo));
</script>
