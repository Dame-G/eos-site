<!-- @dsCard group="Patterns" height=1020 subtitle="A multi-step form with an error summary" -->
<style>body{margin:0;padding:16px;background:var(--surface)}</style>
<div id="root" class="op-root"></div>
<script>
  var P = window.OpenPractice, h = React.createElement;

  function Demo() {
    var s1 = React.useState({ first: "", last: "", phone: "" }), v = s1[0], setV = s1[1];
    var s2 = React.useState([]), errors = s2[0], setErrors = s2[1];
    function submit(e) {
      e.preventDefault();
      var er = [];
      if (!v.first.trim()) er.push({ id: "reg-first", field: "First name", message: "Enter your first name" });
      if (!v.last.trim()) er.push({ id: "reg-last", field: "Last name", message: "Enter your last name" });
      if (v.phone.replace(/\D/g,"").length < 10) er.push({ id: "reg-phone", field: "Mobile number", message: "Enter a mobile number with 10 digits" });
      setErrors(er);
    }
    function err(id) { var f = errors.filter(function(x){return x.id===id;})[0]; return f && f.message; }
    return h("form",{onSubmit:submit,noValidate:true,style:{maxWidth:560}},h(P.Stack,{gap:6},
      h(P.Stepper,{label:"Registration",steps:[{label:"Your details",state:"current"},{label:"How you will pay",state:"todo"},{label:"Forms",state:"todo"},{label:"Review",state:"todo"}]}),
      h(P.ErrorSummary,{errors:errors,autoFocus:false}),
      h(P.FormSection,{title:"Your details",description:"We use these to find your account and send reminders."},
        h(P.Field,{id:"reg-first",label:"First name",required:true,autoComplete:"given-name",value:v.first,onChange:function(x){setV(Object.assign({},v,{first:x}));},error:err("reg-first")}),
        h(P.Field,{id:"reg-last",label:"Last name",required:true,autoComplete:"family-name",value:v.last,onChange:function(x){setV(Object.assign({},v,{last:x}));},error:err("reg-last")}),
        h(P.DatePicker,{label:"Date of birth",required:true,max:new Date(),hint:"Type it or choose from the calendar."}),
        h(P.PhoneField,{id:"reg-phone",label:"Mobile phone",required:true,value:v.phone,onChange:function(x){setV(Object.assign({},v,{phone:x}));},error:err("reg-phone"),hint:"We will text a code to confirm it."})),
      h(P.Actions,null,h(P.Button,{type:"submit"},"Continue"),h(P.Button,{variant:"outline"},"Save and finish later"))));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(Demo));
</script>
