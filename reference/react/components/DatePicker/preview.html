<style>body{margin:0;padding:16px;background:var(--surface)}</style>
<div id="root" class="op-root"></div>
<script>
  var P = window.OpenPractice, h = React.createElement;
  ReactDOM.createRoot(document.getElementById("root")).render(h("div",{style:{maxWidth:360}},h(P.DatePicker,{label:"Date of birth",required:true,defaultValue:new Date(1981,3,12),hint:"Type MM/DD/YYYY or choose from the calendar.",max:new Date()})));
  setTimeout(function(){var b=document.querySelector(".op-combo-btn[aria-label='Choose date']"); if(b) b.click();},350);
</script>
