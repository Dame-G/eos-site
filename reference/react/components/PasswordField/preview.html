<!-- @dsCard group="Forms" height=450 subtitle="Show and hide, with live rules" -->
<style>body{margin:0;padding:16px;background:var(--surface)}</style>
<div id="root" class="op-root"></div>
<script>
  var P = window.OpenPractice, h = React.createElement;
  function PasswordDemo() {
    var s = React.useState("");
    return h("div",{style:{maxWidth:380,display:"grid",gap:28}},
      h(P.PasswordField,{label:"New password",mode:"new",value:s[0],onChange:s[1],required:true,rules:[{label:"At least 10 characters",test:function(v){return v.length>=10;}},{label:"A number",test:function(v){return /\d/.test(v);}},{label:"Not your email address",test:function(v){return v.length>0&&v.indexOf("@")<0;}}]}),
      h(P.PasswordField,{label:"Password",defaultValue:"wrong-password",error:"That password is not right. Try again, or reset it."}));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(PasswordDemo));
</script>
