<!-- @dsCard group="Forms" height=470 subtitle="Month grid for one date, a range, or open times" -->
<style>body{margin:0;padding:16px;background:var(--surface)}</style>
<div id="root" class="op-root"></div>
<script>
  var P = window.OpenPractice, h = React.createElement;
  var box = {boxShadow:"var(--edge)",borderRadius:8,padding:12,boxSizing:"border-box",maxWidth:"100%"};
  function Scheduling() {
    var s = React.useState(new Date(2026,9,22)), v = s[0], set = s[1];
    return h("div",{style:box},h(P.Calendar,{value:v,month:v,onChange:set,min:new Date(2026,9,18),marked:function(d){return d.getDay()>0&&d.getDay()<6&&d.getDate()%3!==0;},disabledDate:function(d){return d.getDay()===0||d.getDay()===6;},markLabel:"times available",footer:false}));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h("div",{style:{display:"flex",gap:24,flexWrap:"wrap"}},h("div",{id:"yearcal",style:box},h(P.Calendar,{value:new Date(1981,3,12),month:new Date(1981,3,12),footer:false,onChange:function(){}})),h(Scheduling)));
  setTimeout(function(){setTimeout(function(){var b=document.querySelector('#yearcal .op-cal-pick[aria-label^="Choose year"]'); if(b) b.click();},350);},350);
</script>
