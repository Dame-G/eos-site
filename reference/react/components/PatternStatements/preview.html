<!-- @dsCard group="Patterns" height=900 subtitle="Find, filter and open statements" -->
<style>body{margin:0;padding:16px;background:var(--surface)}</style>
<div id="root" class="op-root"></div>
<script>
  var P = window.OpenPractice, h = React.createElement;

  function Demo() {
    var s1 = React.useState("all"), f = s1[0], setF = s1[1];
    var all = [
      { id:1, title:"Visit on Oct 2", sub:"Statement 4471 \u00b7 Main office", status:"due", amount:162.4, reason:"Your balance is due by November 1." },
      { id:2, title:"Follow-up visit", sub:"Statement 4402 \u00b7 Main office", status:"paid", amount:84, reason:"Paid Sep 18." },
      { id:3, title:"Consultation", sub:"Statement 4290 \u00b7 Downtown location", status:"overdue", amount:310, reason:"This balance is past due." },
      { id:4, title:"Package of 4 sessions", sub:"Statement 4188 \u00b7 Online", status:"paid", amount:480, reason:"Paid Aug 3." }
    ];
    var shown = all.filter(function(x){ return f==="all" || x.status===f || (f==="due" && x.status==="overdue"); });
    return h("div",{style:{maxWidth:720}},h(P.Stack,{gap:4},
      h(P.PageHeader,{headingLevel:2,title:"Statements and receipts",description:"Everything you have been billed, newest first."}),
      h(P.SearchBar,{placeholder:"Search by visit or statement number"}),
      h(P.Inline,{justify:"between"},
        h(P.ButtonGroup,{label:"Show"},[["all","All"],["due","Needs payment"],["paid","Paid"]].map(function(o){return h(P.ToggleButton,{key:o[0],pressed:f===o[0],onChange:function(){setF(o[0]);}},o[1]);})),
        h(P.Text,{variant:"small",muted:true},shown.length+" statements")),
      h(P.Stack,{gap:2},shown.map(function(x){return h(P.StatementRow,{key:x.id,title:x.title,subtitle:x.sub,status:x.status,amount:x.amount,reason:x.reason,actions:x.status==="paid"?h(P.Button,{variant:"outline",icon:"download"},"Download receipt"):[h(P.Button,{key:"p",icon:"card"},"Pay $"+x.amount.toFixed(2)),h(P.Button,{key:"d",variant:"outline",icon:"download"},"Download")]});}))));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(Demo));
</script>
